plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.asgardians'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': 'com.asgardians.AsgardiansPluginTest', 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Opens the side panel on the Santa Claws page without RuneLite: sample data by default, or a (local) clan website
// with --args="--live <api address> <rsn> <account hash>". See SantaPreview.
tasks.register('santaPreview', JavaExec) {
	group = 'application'
	description = 'Opens the Santa Claws side panel page with sample or live data.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set('com.asgardians.SantaPreview')
	// e.g. -Dsanta.open=boss,attack:901 to picture those cards opened.
	systemProperty 'santa.open', System.getProperty('santa.open', '')
	// -Dsanta.blind=true to picture Throws Shade (the clan blinded).
	systemProperty 'santa.blind', System.getProperty('santa.blind', 'false')
	systemProperty 'santa.nutshot', System.getProperty('santa.nutshot', 'false')
	systemProperty 'santa.decoy', System.getProperty('santa.decoy', 'false')
}
